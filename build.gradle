plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Mod Menu
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    // Cloth Config
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    // Minecraft (unobfuscated, Mojang official mappings)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // In 26.1+, standard Gradle configurations are used (implementation instead of modImplementation)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu (for config screen integration)
    implementation("com.terraformersmc:modmenu:21.0.0-beta.1") {
        transitive = false
    }

    // Cloth Config — soft dependency, so compileOnly: we build against the API but never
    // require it at runtime (see ConfigScreens). Keeping it off the dev runtime classpath also
    // means `runClient` exercises the built-in screen and the class-loading guard by default;
    // drop a Cloth jar into the run mods folder to exercise the Cloth path instead.
    // Non-transitive: it would otherwise drag in its own Fabric API build.
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        transitive = false
    }

    // Unit tests cover the dependency-free logic only (see src/test/java), so no Minecraft
    // runtime is needed and `gradlew test` stays fast.
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}



